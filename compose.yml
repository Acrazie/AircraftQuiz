services:
    nginx:
        image: nginx:alpine
        container_name: aircraft_nginx
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - frontend
            - backend
        networks:
            - aircraft-network
    database:
        image: postgres:18-alpine
        container_name: aircraft_db
        restart: unless-stopped
        env_file: .env.dev
        volumes:
            - db-data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        networks:
            - aircraft-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
    backend:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: aircraft_backend
        restart: unless-stopped
        volumes:
            - ./server:/src
        env_file:
            - .env.dev
        depends_on:
            database:
                condition: service_healthy
        command:
            ["sh", "-lc", "composer install && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console doctrine:fixtures:load --no-interaction && php -S 0.0.0.0:8000 -t public"]
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/api/questions?count=1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s
        networks:
            - aircraft-network
    cdn:
        image: node:20-alpine
        container_name: aircraft_cdn
        restart: unless-stopped
        volumes:
            - ./server/images:/images:ro
        ports:
            - "8080:8080"
        command: ["npx", "--yes", "http-server", "/images", "-p", "8080", "--cors"]
        networks:
            - aircraft-network
    frontend:
        build:
            context: ./client
            dockerfile: Dockerfile
        container_name: aircraft_frontend
        restart: unless-stopped
        volumes:
            - ./client:/src
            - /src/node_modules
        networks:
            - aircraft-network
        depends_on:
            backend:
                condition: service_healthy
            cdn:
                condition: service_started
volumes:
    db-data:
networks:
    aircraft-network:
        driver: bridge
