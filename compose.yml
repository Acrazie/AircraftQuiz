services:
    nginx:
        image: nginx:alpine
        container_name: aircraft_nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/main.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
            - ./nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
            - ./nginx/certs:/etc/nginx/certs:ro
            - ./server/public:/src/public:ro
        depends_on:
            - frontend
            - backend
        networks:
            - aircraft-network
    database:
        image: postgres:17-alpine
        container_name: aircraft_db
        restart: unless-stopped
        env_file: .env.dev
        volumes:
            - db-data:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5432:5432"
        networks:
            - aircraft-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
    backend:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: aircraft_backend
        restart: unless-stopped
        volumes:
            - ./server:/src
        env_file:
            - .env.dev
        depends_on:
            database:
                condition: service_healthy
        command:
            ["sh", "-lc", "composer install && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console doctrine:fixtures:load --no-interaction && php-fpm"]
        healthcheck:
            test: ["CMD-SHELL", "php -r \"@fsockopen('localhost', 9000) or exit(1);\""]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s
        networks:
            - aircraft-network
    cdn:
        image: node:20-alpine
        container_name: aircraft_cdn
        restart: unless-stopped
        volumes:
            - ./server/images:/images:ro
        command: ["npx", "--yes", "http-server", "/images", "-p", "8080"]
        networks:
            - aircraft-network
    frontend:
        build:
            context: ./client
            dockerfile: Dockerfile
        container_name: aircraft_frontend
        restart: unless-stopped
        volumes:
            - ./client:/src
            - /src/node_modules
        networks:
            - aircraft-network
        depends_on:
            backend:
                condition: service_healthy
            cdn:
                condition: service_started
volumes:
    db-data:
networks:
    aircraft-network:
        driver: bridge
