# HTTP → HTTPS redirect
server {
    listen 80;
    server_name localhost;

    # Health check accessible on HTTP (for external monitors)
    location /health {
        access_log off;
        include /etc/nginx/security_headers.conf;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Security headers ---
    include /etc/nginx/security_headers.conf;

    # --- Body size limit ---
    client_max_body_size 10m;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Health check ---
    location /health {
        access_log off;
        include /etc/nginx/security_headers.conf;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # --- Auth endpoints (rate limited) ---
    location = /api/login_check {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /src/public/index.php;
        include fastcgi_params;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 32k;
    }
    location = /api/token/refresh {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /src/public/index.php;
        include fastcgi_params;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 32k;
    }
    location ~ ^/api/(register|auth/google) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /src/public/index.php;
        include fastcgi_params;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 32k;
    }

    # --- API routes (fastcgi to php-fpm) ---
    location /api/ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /src/public/index.php;
        include fastcgi_params;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 32k;
    }
    location = /api {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /src/public/index.php;
        include fastcgi_params;
    }

    # --- Static assets from Symfony public/ (bundles, etc.) ---
    location ~ ^/bundles/ {
        root /src/public;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Symfony dev tools (remove in production) ---
    location ~ ^/(_profiler|_wdt) {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /src/public/index.php;
        include fastcgi_params;
    }

    # --- CDN proxy (aircraft images) ---
    location /cdn/ {
        proxy_pass http://cdn:8080/;
        include /etc/nginx/proxy_params.conf;
        include /etc/nginx/security_headers.conf;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Frontend (Vite dev server) ---
    location / {
        proxy_pass http://frontend:5173;
        include /etc/nginx/proxy_params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
