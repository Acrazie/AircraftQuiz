version: 2
updates:
  # Frontend — Bun (uses npm ecosystem for package.json compatibility)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"

  # Backend — Composer (Symfony / PHP)
  - package-ecosystem: "composer"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"

  # Docker — base images in Dockerfiles and compose.yml
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "main"
